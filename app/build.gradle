plugins {
    id 'com.android.application'
}

android {
    namespace 'com.echomind.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.echomind.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75'
}
